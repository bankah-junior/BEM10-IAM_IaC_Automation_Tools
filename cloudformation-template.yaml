AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 2 - IAM Automation with Permissions Boundary for EC2 User 2

Resources:
  # -----------------------------
  # Secrets Manager: Auto-generate 16-character password
  # -----------------------------
  UserTempPassword:
    Type: AWS::IAM::ManagedPolicy # Helper policy for password changes
    Properties:
      ManagedPolicyName: AllowPasswordChange
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iam:ChangePassword
            Resource: "*"

  SharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: lab-user-temp-password
      GenerateSecretString:
        SecretStringTemplate: '{"password":""}'
        GenerateStringKey: password
        PasswordLength: 16
        RequireEachIncludedType: true

  # -----------------------------
  # Permissions Boundary
  # -----------------------------
  EC2ViewOnlyBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EC2ViewOnlyBoundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:Describe*
              - iam:ChangePassword
            Resource: "*"

  # -----------------------------
  # IAM Groups
  # -----------------------------
  S3Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3Group
      ManagedPolicyArns:
        - !Ref UserTempPassword
      Policies:
        - PolicyName: S3ListPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"

  EC2Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2Group
      ManagedPolicyArns:
        - !Ref UserTempPassword
      Policies:
        - PolicyName: EC2ActionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:RunInstances
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:CreateTags
                Resource: "*"

  # -----------------------------
  # IAM Users
  # -----------------------------
  EC2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user1
      Groups: [!Ref EC2Group]
      LoginProfile:
        Password: "{{resolve:secretsmanager:lab-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true

  EC2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user2
      Groups: [!Ref EC2Group]
      # Boundary prevents the 'ec2:RunInstances' granted by the group
      PermissionsBoundary: !Ref EC2ViewOnlyBoundary
      LoginProfile:
        Password: "{{resolve:secretsmanager:lab-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true

  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: s3-user
      Groups: [!Ref S3Group]
      LoginProfile:
        Password: "{{resolve:secretsmanager:lab-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true
